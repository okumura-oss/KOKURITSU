/* ================= gauges (arc = value) ================= */
const gauges={};
KEYS.forEach(k=>{const g=GA[k];gauges[k]={...g,cv:C('g_'+k,g.cx-g.r,g.cy-g.r,2*g.r,2*g.r),shown:-1};});
function angOf(k,v){const g=GA[k];const kk=(355-g.end)/(VMAX[k]-V0[k]);return Math.max(2,Math.min(356,g.end+(v-V0[k])*kk));}
function sector(x,cx,cy,r,a0,a1){x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,(a0-90)*Math.PI/180,(a1-90)*Math.PI/180);x.closePath();}
function drawGauge(k,base,arcImg){
  const g=gauges[k],c=g.cv,x=c.x;const a=angOf(k,cur[k]);
  if(Math.abs(a-g.shown)<.05&&!g.force)return;g.shown=a;g.force=false;
  c.begin();x.drawImage(base,c.X,c.Y,c.w,c.h,c.X,c.Y,c.w,c.h);
  x.globalCompositeOperation='lighter';
  const end=Math.min(a,g.end);
  x.save();sector(x,g.cx,g.cy,g.r,-1,end);x.clip();x.drawImage(arcImg,c.X,c.Y);x.restore();
  if(a>g.end){const d=a-g.end;x.save();sector(x,g.cx,g.cy,g.r,g.end-.3,a);x.clip();
    x.translate(g.cx,g.cy);x.rotate(d*Math.PI/180);x.translate(-g.cx,-g.cy);x.drawImage(arcImg,c.X,c.Y);x.restore();}
}

/* ================= figure / heart ================= */
const fig=C('cFig',100,128,275,566),heart=C('cHeart',650,805,220,300);
const fb=document.createElement('canvas'),fbx=fb.getContext('2d');
function drawFig(base,img,dt){
  const c=fig,x=c.x;c.begin();x.drawImage(base,c.X,c.Y,c.w,c.h,c.X,c.Y,c.w,c.h);
  const AX=233.5,FY=690;
  // 体の変化：TALL＝身長、POWER＝筋肉量（上半身ほど大きく変化）
  const tall=cur.tall,pw=cur.power;
  const sy=tall<180?1-(180-tall)*0.008:1+(tall-180)*0.0013;
  const su=1+(pw-56)*0.0042,sl=1+(pw-56)*0.0022;
  const W=Math.ceil(c.w*RES),H=Math.ceil(c.h*RES);if(fb.width!==W||fb.height!==H){fb.width=W;fb.height=H;}
  fbx.setTransform(1,0,0,1,0,0);fbx.clearRect(0,0,W,H);fbx.setTransform(RES,0,0,RES,-c.X*RES,-c.Y*RES);
  for(let ys=160;ys<700;ys+=2){const f=Math.min(1,Math.max(0,(ys-380)/90));const k=f*f*(3-2*f);const s=su*(1-k)+sl*k;
    fbx.drawImage(img,0,ys-160,275,2,AX-(AX-100)*s,FY-(FY-ys)*sy,275*s,2*sy+.7);}
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='lighter';
  const flick=.95+.05*Math.sin(tme*31)*Math.sin(tme*7.3);
  const br=Math.max(.55,1+(pw-56)*0.006)*flick;
  x.globalAlpha=Math.min(1,br);x.drawImage(fb,0,0);
  if(br>1){x.globalAlpha=br-1;x.drawImage(fb,0,0);}
  // 高レベルほどオーラ
  if(pw>56){x.filter=`blur(${10*RES}px)`;x.globalAlpha=(pw-56)/43*(.75+.25*Math.sin(tme*3));x.drawImage(fb,0,0);x.filter='none';}
  // scan band
  const sy2=430+Math.sin(tme*.8)*250;
  const [OW,OH]=offc(c.w,c.h);ox.setTransform(1,0,0,1,0,0);ox.drawImage(fb,0,0);ox.setTransform(RES,0,0,RES,-c.X*RES,-c.Y*RES);
  ox.globalCompositeOperation='destination-in';const gr=ox.createLinearGradient(0,sy2-26,0,sy2+26);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');ox.fillStyle=gr;ox.fillRect(c.X,c.Y,c.w,c.h);
  x.globalAlpha=Math.min(1,br);x.drawImage(off,0,0,OW,OH,0,0,OW,OH);x.drawImage(off,0,0,OW,OH,0,0,OW,OH);
  // level-change pulse
  const p=tme-changeT;if(p<1){x.globalAlpha=(1-p)*.9;x.drawImage(fb,0,0);}
  x.globalAlpha=1;
}
let hr=72;
function drawHeart(base,img){
  const c=heart,x=c.x;c.begin();x.drawImage(base,c.X,c.Y,c.w,c.h,c.X,c.Y,c.w,c.h);
  const ph=(tme*hr/60)%1;const beat=1+.045*Math.exp(-ph*12)+.02*Math.exp(-Math.pow((ph-.24)*14,2));
  x.globalCompositeOperation='lighter';
  const CX=759.8,CY=990;
  x.save();x.translate(CX,CY);x.scale(beat,beat);x.translate(-CX,-CY);x.drawImage(img,650,805);x.restore();
  x.globalAlpha=Math.max(0,(beat-1)*9);x.save();x.translate(CX,CY);x.scale(beat,beat);x.translate(-CX,-CY);x.drawImage(img,650,805);x.restore();x.globalAlpha=1;
}

/* ================= fx (screen-blended highlights of the design itself) ================= */
const fx=C('fx',0,0,2048,1283);
function hiRing(base,cx,cy,r0,r1,ang,span,alpha,times=1){
  const S=2*r1;const [W,H]=offc(S,S);ox.setTransform(RES,0,0,RES,(-cx+r1)*RES,(-cy+r1)*RES);
  const cg=ox.createConicGradient((ang-90)*Math.PI/180-span*Math.PI/180,cx,cy);
  cg.addColorStop(0,'rgba(0,0,0,0)');cg.addColorStop(span/360*.85,'rgba(0,0,0,1)');cg.addColorStop(span/360,'rgba(0,0,0,0)');cg.addColorStop(1,'rgba(0,0,0,0)');
  ox.fillStyle=cg;ox.beginPath();ox.arc(cx,cy,r1,0,7);ox.arc(cx,cy,r0,0,7,true);ox.fill();
  ox.globalCompositeOperation='source-in';ox.drawImage(base,cx-r1,cy-r1,S,S,cx-r1,cy-r1,S,S);
  const x=fx.x;x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='lighter';x.globalAlpha=alpha;
  const X=Math.round((cx-r1)*RES),Y=Math.round((cy-r1)*RES);for(let i=0;i<times;i++)x.drawImage(off,0,0,W,H,X,Y,W,H);x.restore();}
function hiRect(base,rx,ry,rw,rh,pos,band,alpha,vertical){
  const [W,H]=offc(rw,rh);ox.setTransform(RES,0,0,RES,-rx*RES,-ry*RES);
  const p=vertical?ry+pos*rh:rx+pos*rw;const gr=vertical?ox.createLinearGradient(0,p-band,0,p+band):ox.createLinearGradient(p-band,0,p+band,0);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
  ox.fillStyle=gr;ox.fillRect(rx,ry,rw,rh);
  ox.globalCompositeOperation='destination-in';const fd=vertical?ox.createLinearGradient(rx,0,rx+rw,0):ox.createLinearGradient(0,ry,0,ry+rh);
  fd.addColorStop(0,'rgba(0,0,0,0)');fd.addColorStop(.25,'rgba(0,0,0,1)');fd.addColorStop(.75,'rgba(0,0,0,1)');fd.addColorStop(1,'rgba(0,0,0,0)');ox.fillStyle=fd;ox.fillRect(rx,ry,rw,rh);
  ox.globalCompositeOperation='source-in';ox.drawImage(base,rx,ry,rw,rh,rx,ry,rw,rh);
  const x=fx.x;x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='lighter';x.globalAlpha=alpha;x.drawImage(off,0,0,W,H,Math.round(rx*RES),Math.round(ry*RES),W,H);x.drawImage(off,0,0,W,H,Math.round(rx*RES),Math.round(ry*RES),W,H);x.restore();}
function glow(cx,cy,r,col,a){const x=fx.x;x.save();x.globalCompositeOperation='lighter';const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r);x.restore();}
function drawFx(base){
  fx.begin();const t=tme;
  // LEVEL dial
  hiRing(base,753,382,170,256,(t*40)%360,70,.9);
  hiRing(base,753,382,170,256,(200-t*25)%360+360,50,.6);
  const p=t-changeT;if(p<.9)hiRing(base,753,382,165,260,p/.9*360+120,90,1.2*(1-p/.9),2);
  // server + status rings
  hiRing(base,1823,212,70,128,(t*55)%360,80,.9);
  [1171,1289,1407,1524].forEach((cx,i)=>hiRing(base,cx,1124,30,52,(t*70+i*90)%360,70,.8));
  // small gauge outer rings
  Object.values(GA).forEach((g,i)=>hiRing(base,g.cx,g.cy,g.r-24,g.r,(t*50+i*70)%360,60,.7));
  // pads
  hiRect(base,80,640,310,90,(t*.35)%1.3-.15,40,.9);
  hiRect(base,640,1085,240,75,((t*.35)+.5)%1.3-.15,40,.9);
  if(p<1)glow(233,690,140,'rgba(90,190,255,A)',.5*(1-p));
  // ECG + heart icon
  hiRect(base,62,740,305,65,(t*.5)%1.2-.1,22,1);
  const ph=(t*hr/60)%1;glow(377,779,22,'rgba(255,70,80,A)',.7*Math.exp(-ph*8));
  // lines / sparklines
  hiRect(base,1140,790,445,160,(t*.22)%1.2-.1,35,.8);
  hiRect(base,1230,335,90,50,(t*.6)%1.3-.15,14,1);hiRect(base,1475,335,90,50,(t*.6+.4)%1.3-.15,14,1);
  hiRect(base,1655,555,355,45,(t*.4)%1.2-.1,25,.9);
  hiRect(base,555,850,65,300,(t*.5)%1.2-.1,30,.8,true);
  hiRect(base,1640,90,380,250,(t*.3)%1.2-.1,40,.6);
  // body scan
  hiRect(base,75,990,300,110,(t*.3)%1.2-.1,10,1.2);
  hiRect(base,310,995,65,100,1-((t*.6)%1.2-.1),12,1,true);
  // biometric heart ring + bottom bar
  hiRing(base,760,975,100,160,(t*35)%360,60,.6);
  hiRect(base,880,1225,620,50,(t*.25)%1.3-.15,40,.6);
}

/* ================= interaction ================= */
const RED={"x": 511, "y": 149, "cx": 753, "cy": 382, "ang": 312.5};const RMIN=RED.ang-3*36,RMAX=RED.ang+6*36;
let redAng=RED.ang,dragging=false;
const red=C('cRed',488,117,530,530);
function drawRed(img,dt){
  const tgt=RED.ang+(level-4)*36;if(!dragging)redAng+=(tgt-redAng)*Math.min(1,dt*9);
  const c=red,x=c.x;c.begin();x.save();x.translate(RED.cx,RED.cy);x.rotate((redAng-RED.ang)*Math.PI/180);x.translate(-RED.cx,-RED.cy);
  x.drawImage(img,RED.x,RED.y);x.globalCompositeOperation='lighter';x.globalAlpha=.18+.14*Math.sin(tme*4)+(dragging?.3:0);x.drawImage(img,RED.x,RED.y);x.restore();}
function setLevel(k,silent){k=Math.max(1,Math.min(10,k));if(k===level&&!silent)return;level=k;
  TABLE[k-1].forEach((v,i)=>target[KEYS[i]]=v);dirtyText=true;
  if(!silent){changeT=tme;glitchT=tme;}}
function sxy(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)/SC,(e.clientY-r.top)/SC];}
{const hit=document.getElementById('hit');let prev=null;
 const pang=e=>{const [X,Y]=sxy(e);return ((Math.atan2(X-RED.cx,-(Y-RED.cy))*180/Math.PI)%360+360)%360;};
 const apply=()=>{redAng=Math.max(RMIN,Math.min(RMAX,redAng));setLevel(Math.round((redAng-RMIN)/36)+1);};
 hit.addEventListener('pointerdown',e=>{hit.setPointerCapture(e.pointerId);dragging=true;const pa=pang(e);prev=pa;
   let ca=pa;while(ca<RMIN-18)ca+=360;while(ca>RMAX+18)ca-=360;
   if(Math.abs(ca-redAng)>25){redAng=ca;apply();}});
 hit.addEventListener('pointermove',e=>{if(!hit.hasPointerCapture(e.pointerId)||prev===null)return;const pa=pang(e);let d=pa-prev;d=((d+540)%360)-180;prev=pa;redAng+=d;apply();});
 ['pointerup','pointercancel'].forEach(v=>hit.addEventListener(v,()=>{dragging=false;prev=null;}));}
{const z=document.getElementById('rst');let lp;
 z.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{setLevel(INIT);},2000);});['pointerup','pointercancel','pointerleave'].forEach(v=>z.addEventListener(v,()=>clearTimeout(lp)));}

/* ================= start ================= */
fit();
const baseImg=document.getElementById('base');
Promise.all([baseImg.decode?baseImg.decode().catch(()=>{}):Promise.resolve(),
  ...['fig','heart',...KEYS,'red'].map(k=>load('data:image/webp;base64,'+IMG[k])),
  document.fonts.load('500 40px S'),document.fonts.load('400 20px S'),document.fonts.load('400 20px SC')]).then(r=>{
  const L={};['fig','heart',...KEYS,'red'].forEach((k,i)=>L[k]=r[i+1]);
  let last=performance.now();
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tme+=dt;
    try{
      let moving=false;for(const k of KEYS){const d=target[k]-cur[k];if(Math.abs(d)>.02){cur[k]+=d*Math.min(1,dt*3.5);moving=true;}else cur[k]=target[k];}
      if(moving||tme-glitchT<.45)dirtyText=true;
      if(dirtyText){drawText();dirtyText=false;}
      KEYS.forEach(k=>drawGauge(k,baseImg,L[k]));
      drawRed(L.red,dt);drawFig(baseImg,L.fig,dt);drawHeart(baseImg,L.heart);drawFx(baseImg);
    }catch(err){console.warn(err);}
    requestAnimationFrame(loop);}
  sized.push(()=>KEYS.forEach(k=>gauges[k].force=true));fit();
  requestAnimationFrame(loop);
});
})();
</script>
